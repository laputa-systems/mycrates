[package]
name = "mycrates"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Lean Rust registry"
repository = "https://github.com/joshuarli/mycrates"
autobins = false

[lib]
name = "mycrates"
path = "src/lib.rs"

[[bin]]
name = "mycrates"
path = "src/main.rs"

[dependencies]
deser = { version = "0.10", features = ["derive"] }
deser-json = "0.10"
deser-toml = "0.10"
deser-value = "0.10"
h12tiny-client-sync = { version = "0.6.0", path = "../h12tiny/crates/h12tiny-client-sync", features = ["tls"] }
sha2 = "0.10"
flate2 = { version = "1.0", features = ["miniz_oxide"] }
tar = "0.4"
httparse = "1.9"
tempfile = "3.13"
url = "2.5"

[dev-dependencies]
tempfile = "3.13"
