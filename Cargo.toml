[package]
name = "mycrates"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Lean Rust registry"
repository = "https://github.com/joshuarli/mycrates"
autobins = false

[lib]
name = "mycrates"
path = "src/lib.rs"

[[bin]]
name = "mycrates"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
flate2 = { version = "1.0", features = ["miniz_oxide"] }
tar = "0.4"
lexopt = "0.3"
httparse = "1.9"
ureq = { version = "3.0", features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3.13"
