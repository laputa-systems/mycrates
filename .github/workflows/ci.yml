name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  egress-enforced:
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup rust
        run: rustup show
      - name: pre-fetch dependencies
        run: cargo fetch --locked
      - name: test network none
        run: docker run --network none -e RUSTUP_TOOLCHAIN=1.99.1 -e CARGO_TARGET_DIR=/tmp/target -v ${{ github.workspace }}:/workspace -v ~/.cargo/registry:/usr/local/cargo/registry:ro -v ~/.cargo/git:/usr/local/cargo/git:ro -w /workspace rust:1.99 bash -c "cargo test --locked"
